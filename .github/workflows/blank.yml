name: "Compile iOS IPA via Release Asset"
on: [workflow_dispatch]

jobs:
  compile-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Large Zip from Release
        run: |
          # Updated to match your exact file name from the screenshot
          curl -L -o project_assets.zip https://github.com{{ github.repository }}/releases/download/v1.0/Fnaf.slDocuments.zip
          unzip project_assets.zip -d .

      - name: Compile Unsigned IPA
        run: |
          # Compiles your existing exported xcodeproj
          xcodebuild -project "FNAF sl godot.xcodeproj" -scheme "FNAF sl godot" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build
          
          # Sets up the standard iOS package format
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          
          # Injects your .pck data directly into the app structure
          cp "FNAF sl godot.pck" Payload/*.app/ || true
          
          # Compresses everything into your final IPA bundle
          zip -r fnaf_sl_game.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: ksign-ready-ipa
          path: fnaf_sl_game.ipa
