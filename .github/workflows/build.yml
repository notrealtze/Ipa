name: Extract Release Assets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and extract release asset
        run: |
          wget https://github.com/notrealtze/Ipa/releases/download/Game/Fnaf.slDocuments.zip
          unzip Fnaf.slDocuments.zip -d .
      
      - name: Commit extracted files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Extract Fnaf.slDocuments.zip" || echo "No changes to commit"
          git push
