name: "Compile iOS IPA via Release Asset"
on: [workflow_dispatch]

# Explicitly allows the workflow tool to bypass the 404 block and read your assets
permissions:
  contents: read

jobs:
  compile-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Asset Securely
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "notrealtze/ipa"
          tag: "v1.0"
          fileName: "Fnaf.slDocuments.zip"

      - name: Extract Xcode Assets
        run: |
          unzip Fnaf.slDocuments.zip -d .

      - name: Compile Unsigned IPA
        run: |
          xcodebuild -project "FNAF sl godot.xcodeproj" -scheme "FNAF sl godot" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          cp "FNAF sl godot.pck" Payload/*.app/ || true
          zip -r fnaf_sl_game.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: ksign-ready-ipa
          path: fnaf_sl_game.ipa
