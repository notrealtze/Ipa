name: "Compile iOS IPA Directly"
on: [workflow_dispatch]

jobs:
  compile-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # No downloader required! It reads your uploaded zip directly from your files
      - name: Extract Xcode Assets
        run: |
          unzip project_zip/Fnaf.slDocuments.zip -d .

      - name: Compile Unsigned IPA
        run: |
          xcodebuild -project "FNAF sl godot.xcodeproj" -scheme "FNAF sl godot" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO OBJROOT=$PWD/build SYMROOT=$PWD/build
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          cp "FNAF sl godot.pck" Payload/*.app/ || true
          zip -r fnaf_sl_game.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: ksign-ready-ipa
          path: fnaf_sl_game.ipa
